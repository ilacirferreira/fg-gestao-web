<title>FG Gestão – Clientes e Projetos</title>
<style>
:root{
  --bg:#DCE1E7; --panel:#FFFFFF; --soft:#F3F5F7; --line:#C3CAD3; --line2:#E1E5EA;
  --txt:#1E2733; --mut:#4A5565; --blue:#1F5FAD; --blue2:#163F75; --sel:#D6E4F7; --hov:#EEF3FA;
  --ok-bg:#DDF0E4; --ok:#1E5E38; --warn-bg:#FCEBD3; --warn:#7A4A0B; --bad-bg:#F8DEDA; --bad:#8E2A1F;
  --info-bg:#DDE8F7; --info:#163F75; --perm-bg:#ECE3F5; --perm:#5B3A86; --gray-bg:#E9ECF0; --gray:#4A5565;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:Consolas,"Courier New",monospace}
.app{height:100vh;display:flex;flex-direction:column;padding:0 8px}
.titlebar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#1F3B5C;color:#fff;border-radius:0 0 3px 3px}
.titlebar b{font-size:14px;white-space:nowrap}
.titlebar span{font-size:12px;color:#C9D6E6;white-space:nowrap}
.titlebar .usr{margin-left:auto}
/* barra de botões: largura toda, botões do mesmo tamanho */
.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 0}
/* PRÉVIA 05/11 */
.dlg>.modal .mfoot,#pane .acoes-topo{display:none!important}
/* PRÉVIA 05/11 — sem pop-up (Ilacir 00:37–00:39): a janela abre dentro da área de conteúdo, no lugar das abas */
.dlg>.modal{position:static!important;inset:auto;background:none!important;padding:0!important;z-index:auto;flex:1;min-height:0}
.dlg>.modal.on{display:flex}
.dlg>.modal .mbox{width:100%!important;max-width:none!important;max-height:none;height:100%;box-shadow:none;border:none;background:transparent}
.dlg>.modal .mtitle{border-radius:4px}
.dlg>.modal .mbody{overflow:auto;flex:1}
.dlg:has(>.modal.on)>.tabs,.dlg:has(>.modal.on)>.pane{display:none!important}

.headrow{display:flex;gap:8px;align-items:stretch}.headrow>#head{flex:0 0 auto;min-width:230px;max-width:44%}.headrow>#head .crumb,.headrow>#head .tags{display:none}.headrow>#head .headtitle{font-size:19px;white-space:nowrap}.headrow>.kpis{flex:1;min-width:0}
#pgInfo{white-space:nowrap}.headrow .kpi b{font-size:16px}.headrow .kpi{min-width:0;overflow:hidden}.headrow .kpi b,.headrow .kpi em,.headrow .kpi small{overflow:hidden;white-space:nowrap}.headrow>.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.pgbar:has(#pgbarAc button) #pgInfo{display:none}
.tb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:4px 6px;border:1px solid #B9C3CF;border-radius:4px;background:#F7F8FA;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#E4ECF7;border-color:#7FA6DA}
.tb.novo{background:var(--blue);border-color:var(--blue);color:#fff}
.tb.novo:hover{background:var(--blue2)}
.tb.verde{background:#E3F2E8;border-color:#7DB592;color:#1E5E38;font-weight:600}
.tb.verm{background:#FBEAE7;border-color:#D89A90;color:#8E2A1F;font-weight:600}
.tb:disabled{opacity:.45;cursor:default}
.tb svg{flex:none}
.body{display:grid;grid-template-columns:var(--larg,350px) 6px 1fr;gap:2px;flex:1;min-height:0}
.divisor{cursor:col-resize;border-radius:3px;position:relative}
.divisor::after{content:"";position:absolute;left:2px;top:45%;width:2px;height:40px;border-left:1px dotted #8E99A6;border-right:1px dotted #8E99A6}
.divisor:hover,.divisor.arr{background:#C9D6E6}
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.boxhead{padding:6px 8px;border-bottom:1px solid var(--line);background:#EEF1F4;display:flex;gap:6px;align-items:center}
/* árvore */
.left{display:flex;flex-direction:column;min-height:0}
.search{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #B8C0CA;border-radius:3px;background:#fff;min-height:30px}
.search input{border:none;outline:none;width:100%;background:transparent}
.chaves{display:flex;gap:12px;padding:5px 8px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--mut)}
.chave{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sw{width:28px;height:16px;border-radius:8px;background:#C3CAD3;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .12s}
.sw.on{background:var(--blue)}.sw.on::after{left:14px}
.tree{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 6px;scrollbar-width:thin}
.node{display:flex;align-items:center;gap:6px;min-height:26px;padding:2px 6px;border:1px solid transparent;border-radius:3px;cursor:pointer;user-select:none;line-height:1.2}
.node:hover{background:var(--hov)}
.node.sel{background:var(--sel);border-color:#7FA6DA}
.node .nm{flex:1;min-width:0}
.node.b .nm{font-weight:600}
.node.obr .nm{color:#A3271B}
.node.grp{background:#DCE8F8;border-color:#A9C2E6;color:#163F75;margin:2px 0}
.node.grp:hover{background:#CFE0F6}
.node.grp.pfg{background:#E9E2F5;border-color:#C3B3E0;color:#4A2F78}
.node.grp.pfg:hover{background:#E0D6F1}
.node.grp.outg{background:#E6EAEF;border-color:#C3CAD3;color:#2E3A48}
.node.grp.outg:hover{background:#DCE1E7}
.node.grp .cnt{color:inherit;opacity:.8}
.chev{width:12px;height:12px;flex:none;transition:transform .12s}
.chev.op{transform:rotate(90deg)}
.nochev{width:12px;flex:none}
.cnt{font-size:11px;color:#5A6676;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ind{flex:none}
.pgbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;border-top:1px solid var(--line2);font-size:12px;color:var(--mut)}
.pgbar a{color:var(--blue);text-decoration:none;white-space:nowrap}.pgbar a:hover{text-decoration:underline}
.pgbar .pg{display:flex;align-items:center;gap:6px}
.mini{min-width:28px;min-height:24px;border:1px solid #9AA5B2;border-radius:3px;background:#F6F7F9;cursor:pointer}
.mini:disabled{opacity:.4;cursor:default}
.legend{display:flex;gap:8px;flex-wrap:nowrap;justify-content:space-between;padding:5px 8px;white-space:nowrap;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* painel */
.right{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.head{padding:8px 14px;display:flex;align-items:center;gap:12px}
.crumb{font-size:12px;color:var(--mut)}
.headtitle{font-size:17px;font-weight:600;line-height:1.25}
.head .btn{flex:none}
.head .acoes{display:flex;gap:6px}
.tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-perm{background:var(--perm-bg);color:var(--perm)}.t-gray{background:var(--gray-bg);color:var(--gray)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:7px 12px}
.kpi small{display:block;font-size:12px;color:var(--mut);white-space:nowrap}
.kpi b{display:block;font-size:18px;margin-top:1px;white-space:nowrap}
.kpi em{display:block;font-size:11px;color:var(--mut);font-style:normal;white-space:nowrap}
.kpi .bar{height:5px;background:#E6EAEF;border-radius:3px;margin-top:5px;overflow:hidden}
.kpi .bar span{display:block;height:100%;background:var(--blue)}
.dlg{background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px 12px 10px;display:flex;flex-direction:column;flex:1;min-height:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;border-bottom:1px solid var(--line)}
.tab{padding:6px 8px;border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;background:#E9ECF0;color:#3A4554;cursor:pointer;min-height:32px;white-space:nowrap}
.tab.on{background:#fff;color:var(--txt);font-weight:600;position:relative;top:1px}
.pane{background:#fff;border:1px solid var(--line);border-top:none;padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow:hidden}
.ficha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:11.5px;color:var(--mut)}
.fld .v{min-height:28px;line-height:1.3;padding:4px 7px;border:1px solid #D9CF9E;border-radius:3px;background:#FFFBEA}
.fld .v.vz{color:#9AA5B2}
.fld .v.sis{background:#F3F5F7;border-color:#D5DBE2;color:var(--mut)}
.fld input,.fld select{padding:4px 7px;border:1px solid #B8C0CA;border-radius:3px;background:#FFFBEA;min-height:28px}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.secthead{display:flex;align-items:center;gap:8px}
.secthead b{font-size:13px;white-space:nowrap}
.secthead .sp{flex:1}
.btn{min-height:28px;padding:3px 12px;border-radius:3px;border:1px solid #9AA5B2;background:#F6F7F9;cursor:pointer;white-space:nowrap}
.btn:hover{background:#ECEFF3}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue2)}
.btn.ok{background:#2E7D4F;border-color:#2E7D4F;color:#fff}
.btn.red{background:#B23B2E;border-color:#B23B2E;color:#fff}
.tablewrap{border:1px solid var(--line);border-radius:3px;flex:1;min-height:0;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;vertical-align:top;padding:5px 8px;background:#EEF1F4;border-bottom:1px solid var(--line);color:#3A4554;font-size:12px}
td{padding:4px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.w{white-space:normal;line-height:1.25}
td.r,th.r{text-align:right}
tr.hl td{background:#FFF6E5}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--hov)}
tfoot td{font-weight:600;background:#F7F8FA}
.info{padding:6px 10px;background:#EEF3FA;border:1px solid #B9CBE4;border-radius:3px;font-size:12px;line-height:1.35}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.card{border:1px solid var(--line);border-radius:3px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card b{font-size:13px}
.card small{color:var(--mut);overflow-wrap:anywhere}
.file{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:#FAFBFC}
.file .ic{width:34px;height:42px;border:1px solid #B8C0CA;border-radius:2px;background:#fff;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;color:#B23B2E;padding-bottom:4px;flex:none}
.file small{display:block;color:var(--mut);font-size:12px}
.drop{border:1px dashed #9AA5B2;border-radius:3px;padding:12px;text-align:center;color:var(--mut);background:#FAFBFC}
.statusbar{display:flex;gap:22px;padding:4px 14px;margin-top:6px;background:var(--soft);border:1px solid var(--line);border-bottom:none;border-radius:3px 3px 0 0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.statusbar span:last-child{margin-left:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.mbox{width:min(640px,100%);max-height:96vh;background:var(--soft);border:1px solid #8E99A6;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.mtitle{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#1F3B5C;color:#fff;border-radius:4px 4px 0 0;font-weight:600}
.mtitle button{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;width:32px;height:26px}
.mbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.mgrid .fld input,.mgrid .fld select,.mgrid .fld textarea{background:#FFFBEA;padding:4px 7px;border:1px solid #B8C0CA;border-radius:3px;min-height:28px}
.mgrid .fld input[readonly]{background:#F3F5F7;color:var(--mut)}
.mfoot{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:8px 16px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1F3B5C;color:#fff;padding:8px 16px;border-radius:4px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.so-cel{display:none}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tb{font-size:11.5px;white-space:normal;text-align:center;line-height:1.15;padding:3px}
  .kpi b{font-size:15px}.kpi small,.kpi em{white-space:normal}
  .body{grid-template-columns:1fr}
  .divisor{display:none}
  .left{height:70vh}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ficha,.people{grid-template-columns:1fr}
  .s2,.s3{grid-column:auto}
  .tabs{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
  .titlebar span.cam{display:none}
  .so-cel{display:inline}
  td{white-space:normal}
  .titlebar .usr,.statusbar,.mh,tfoot{display:none}
  .secthead{flex-wrap:wrap}
  .tablewrap{overflow-x:auto}
  .app{overflow-x:hidden}
}
/* janelas (pop-up) grandes e com letra maior — usuários idosos (Ilacir 02/11 19:55) */
.modal .mbox{width:min(980px,94vw);font-size:16px}
.modal .mbox.larga{width:min(1180px,96vw)}
.modal .mtitle{font-size:17px;padding:10px 16px}
.modal .mbody{padding:16px 20px;gap:12px}
.modal .mbody label,.modal .fld label{font-size:14px}
.modal .fld .v,.modal input,.modal select,.modal textarea{font-size:16px;min-height:36px}

.modal .mfoot{padding:12px 20px;gap:10px}
.modal .tag{font-size:13px}
.modal .em{font-size:15px;padding:6px 10px}
.modal .et{font-size:14px;padding:8px 12px}

.modal .cnt,.modal small{font-size:13.5px}
.modal .tot small{font-size:13.5px}
.modal .em label,.modal label.em{font-size:15px}

</style>

<script type="text/fg-espera" id="fgMain">
var FG_BASE="";function FG_abrindo(){try{var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(220,225,231,.55);z-index:99;font:600 20px Segoe UI,Arial,sans-serif;color:#1F3B5C';o.innerHTML='<div style="background:#fff;padding:18px 34px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.22)">Abrindo…</div>';document.body.appendChild(o)}catch(e){}}
var FG_VT="";
function FG_ir(p,extra,semPilha){var vt=semPilha?FG_VT:(FG_VT?FG_VT+'.':'')+FG_aqui();vt=vt.split('.').filter(Boolean).slice(-8).join('.');var u=FG_BASE+'?p='+p+(extra||'')+(vt?'&vt='+vt:'');FG_abrindo();try{window.top.location.href=u}catch(e){window.open(u,'_top')}}
function FG_volta(){var a=FG_VT.split('.');var t=a.pop();FG_VT=a.join('.');var q=t.split('_');FG_ir(q[0],q[1]?'&ob='+q[1]:'',true)}
function FG_aqui(){return 'projetos'+(S&&S.sel&&S.sel.t==='obra'&&S.sel.id?'_'+S.sel.id:'')}
var FG_OB=(new URLSearchParams(location.search).get("ob")||"");
var D = {clientes:[],obras:[]};
var HOJE = '';

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brl(v){return 'R$ '+(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function nrm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2600)}

/* ---------- totais ---------- */
function tot(parcs,contrato){
  var t={contrato:contrato||0,faturado:0,recebido:0,receber:0,conferir:0,permuta:0,abertas:0,faturadaSemBaixa:0};
  parcs.forEach(function(p){
    if(p.nf&&p.sit!=='a vencer'&&p.sit!=='permuta')t.faturado+=p.bruto;
    if(p.sit==='paga')t.recebido+=p.liq;
    if(p.sit==='a vencer'){t.receber+=p.bruto;t.abertas++}
    if(p.sit==='a conferir'){t.conferir+=p.bruto;t.abertas++}
    if(p.sit==='permuta')t.permuta+=p.bruto;
    if(p.sit==='faturada')t.faturadaSemBaixa++;
  });
  if(!t.contrato)t.contrato=parcs.reduce(function(a,p){return a+p.bruto},0);
  return t;
}
function totObra(o){return tot(o.parc,o.contrato)}
function totCliente(c){
  var ps=[],ct=0;obrasDe(c.id).forEach(function(o){var pp=parcDe(o,c.id);ps=ps.concat(pp);ct+=(o.cls.length>1?0:(o.contrato||0))});
  var t=tot(ps,0);if(ct>t.contrato)t.contrato=ct;return t;
}
function corObra(o){
  var t=totObra(o);
  if(t.conferir>0||o.sit==='a conferir')return '#C77A12';
  if(t.receber>0)return '#1F5FAD';
  if(t.permuta>0)return '#7A5BA6';
  if(!o.parc.length)return '#9AA5B2';
  if(t.faturadaSemBaixa===o.parc.length)return '#9AA5B2';
  return '#2E7D4F';
}
function corCliente(c){
  var cs=obrasDe(c.id).map(corObra);
  var ord=['#C77A12','#1F5FAD','#7A5BA6','#2E7D4F','#9AA5B2'];
  for(var i=0;i<ord.length;i++)if(cs.indexOf(ord[i])>=0)return ord[i];
  return '#9AA5B2';
}

/* ---------- árvore (linhas visíveis, paginadas) ---------- */
function casa(c){
  if(!obrasDe(c.id).some(function(o){return !o.arq}))return false;
  if(!S.busca)return true;
  var q=nrm(S.busca);
  var alvo=[c.nome,c.doc,c.id,c.grupo].join(' ');
  if(nrm(alvo).indexOf(q)>=0)return true;
  return obrasDe(c.id).some(function(o){return casaObra(o,q)});
}
function casaObra(o,q){
  if(nrm([o.nome,o.id,o.end,o.serv].join(' ')).indexOf(q)>=0)return true;
  return o.parc.some(function(p){return p.nf&&nrm('nf '+p.nf).indexOf(q)>=0||String(p.nf)===S.busca.trim()});
}
function linhas(){
  var L=[],bus=!!S.busca;
  var cls=D.clientes.filter(casa);
  var tem=function(pk){return function(c){return obrasDe(c.id).some(function(o){return pastaDe(o)===pk&&(!bus||casaObra(o,nrm(S.busca))||nrm([c.nome,c.doc,c.id,c.grupo].join(' ')).indexOf(nrm(S.busca))>=0)})}};
  var pastas=[['and','Projetos em Andamento',cls.filter(tem('and'))],['con','Projetos Concluídos',cls.filter(tem('con'))]];
  pastas.forEach(function(pf){
    var fk='F:'+pf[0],op=bus||S.open[fk];
    var np=D.obras.filter(function(o){return pastaDe(o)===pf[0]&&pf[2].some(function(c){return o.cls.indexOf(c.id)>=0})}).length;
    L.push({k:fk,n:0,ic:pf[0]==='ina'?IC.pastaC:IC.pasta,nm:pf[1],b:1,cnt:np+(np===1?' projeto':' projetos'),exp:true,op:op});
    if(!op)return;
    if(!pf[2].length){L.push({k:fk+':v',n:1,nm:'(vazio)',mut:1});return}
    var grupos={},soltos=[];
    pf[2].forEach(function(c){var g=grupoDe(c);if(S.agrupar&&g){(grupos[g]=grupos[g]||[]).push(c)}else soltos.push(c)});
    var itens=[];
    var nProj=function(g){return D.obras.filter(function(o){return pastaDe(o)===pf[0]&&grupos[g].some(function(c){return o.cls.indexOf(c.id)>=0})}).length};
    Object.keys(grupos).sort(function(a,b){return ordemG(a)-ordemG(b)||(ordemG(a)===0?nProj(b)-nProj(a):0)||a.localeCompare(b)}).forEach(function(g){grupos[g].sort(function(a,b){return a.nome.localeCompare(b.nome)});itens.push({g:g,cs:grupos[g]})});
    soltos.sort(function(a,b){return a.nome.localeCompare(b.nome)});
    itens=itens.concat(soltos.map(function(c){return {c:c}}));
    itens.forEach(function(it){
      if(it.g){
        var gk='G:'+pf[0]+':'+it.g,gop=bus||S.open[gk];
        L.push({k:gk,n:1,ic:it.g===PFG?IC.pf:IC.grupo,nm:it.g===PFG?'Pessoa Física (sem CNPJ)':it.g===OUT?OUT:'Grupo '+it.g,b:1,cnt:(function(){var n=D.obras.filter(function(o){return pastaDe(o)===pf[0]&&it.cs.some(function(c){return o.cls.indexOf(c.id)>=0})}).length;return n+(n>1?' projetos':' projeto')})(),exp:true,op:gop,grp:1,pfg:it.g===PFG,outg:it.g===OUT});
        if(gop)it.cs.forEach(function(c){cliLinhas(L,c,2,pf[0])});
      }else cliLinhas(L,it.c,1,pf[0]);
    });
  });
  return L;
}
function cliLinhas(L,c,n,pk){
  var ck='C:'+pk+':'+c.id,op=(S.busca&&true)||S.open[ck];
  var obs=obrasDe(c.id);
  L.push({k:ck,n:n,ic:c.tipo==='PF'?IC.pf:IC.pj,nm:c.nome,b:1,dot:corCliente(c),exp:true,op:op,sel:S.sel.t==='cliente'&&S.sel.id===c.id,act:{t:'cliente',id:c.id,cl:c.id,aba:'cliente'}});
  if(!op)return;
  var q=nrm(S.busca);
  obs.forEach(function(o){
    if(pastaDe(o)!==pk)return;
    if(S.busca&&!casaObra(o,q)&&nrm([c.nome,c.doc,c.id,c.grupo].join(' ')).indexOf(q)<0)return;
    var ok='O:'+pk+':'+c.id+':'+o.id,oop=S.open[ok];
    var selO=S.sel.t==='obra'&&S.sel.id===o.id&&S.sel.cl===c.id;
    L.push({k:ok,n:n+1,ic:IC.obra,nm:o.nome,b:1,obr:1,dot:corObra(o),exp:true,op:oop,sel:selO&&!oop,act:{t:'obra',id:o.id,cl:c.id,aba:'obra'}});
    if(!oop)return;
    var t=totObra(o),ab=function(a){return selO&&S.aba===a};
    L.push({k:ok+':d',n:n+2,ic:IC.doc,nm:'Dados do Projeto',sel:ab('obra'),act:{t:'obra',id:o.id,cl:c.id,aba:'obra'}});
    L.push({k:ok+':c',n:n+2,ic:IC.contr,nm:'Contrato',tag:o.contrato?(t.permuta>0&&t.receber===0?['t-perm','permuta']:['t-ok','cadastrado']):['t-warn','a cadastrar'],sel:ab('contrato'),act:{t:'obra',id:o.id,cl:c.id,aba:'contrato'}});
    L.push({k:ok+':f',n:n+2,ic:IC.din,nm:'Parcelas e Recebimentos',cnt:o.parc.length||'',dot:corObra(o),sel:ab('financeiro'),act:{t:'obra',id:o.id,cl:c.id,aba:'financeiro'}});
    var nn=o.parc.filter(function(p){return /^\d+$/.test(p.nf)}).length;
    L.push({k:ok+':n',n:n+2,ic:IC.doc,nm:'Notas Fiscais',cnt:nn||'',sel:ab('notas'),act:{t:'obra',id:o.id,cl:c.id,aba:'notas'}});
    L.push({k:ok+':x',n:n+2,ic:IC.dwg,nm:'Documentos',tag:o.art?['t-ok','ART']:(ANDAM[o.sit]?['t-warn','sem ART']:null),sel:ab('documentos'),act:{t:'obra',id:o.id,cl:c.id,aba:'documentos'}});
  });
}

function descartar(seguir){
  if(!S.edit){seguir();return}
  document.getElementById('mt').textContent='Alterações não salvas';
  document.getElementById('mbody').innerHTML='<div>Você está editando. Descartar as alterações?</div>';

  document.getElementById('dSim').onclick=function(){fecharModal();S.edit=false;seguir()};

}
function seleciona(a){
  if(S.edit){descartar(function(){seleciona(a)});return}
  S.edit=false;
  S.sel={t:a.t,id:a.id,cl:a.cl};S.aba=a.aba||S.aba;S.pgPar=0;
  if(a.t==='obra'){var pk=pastaDe(OB[a.id]);S.open['F:'+pk]=1;S.open['C:'+pk+':'+a.cl]=1;S.open['G:'+pk+':'+grupoDe(CL[a.cl])]=1}
  desenha();
}

function desenhaPainel(){
  var c=CL[S.sel.cl],o=S.sel.t==='obra'?OB[S.sel.id]:null;
  var ab=abasDe();if(!ab.some(function(a){return a[0]===S.aba}))S.aba=ab[0][0];
  var t=o?tot(parcDe(o,c.id),o.cls.length>1?0:o.contrato):totCliente(c);
  // cabeçalho
  var crumb='Clientes › '+(c.grupo?'Grupo '+esc(c.grupo):grupoDe(c))+' › '+esc(c.nome)+(o?' › Projetos':'');
  var tags='';

  var mov=!o?'':o.arq?'<button class="btn pri" onclick="desarquivar(\''+o.id+'\')">Desarquivar</button>':(pastaDe(o)==='and'?'<button class="btn ok" onclick="moverProjeto()">Mover para Concluídos</button>':'<button class="btn pri" onclick="moverProjeto()">Voltar para Em Andamento</button>')+'<button class="btn" onclick="arquivar()">Arquivar Projeto</button>';

  if(o&&o.parc.some(function(p){return p.semNF}))tags+='<span class="tag t-bad">Recebido sem NF</span>';
  var sub=o?'Projeto <span class="mono">'+o.id+'</span> · Cliente <span class="mono">'+c.id+'</span>'+(o.cls.length>1?' (projeto com '+o.cls.length+' tomadores)':'')+' · Captação: '+esc(o.capt)
            :'Cliente <span class="mono">'+c.id+'</span> · '+(c.tipo==='PF'?'CPF':'CNPJ')+' <span class="mono">'+esc(c.doc)+'</span> · '+obrasDe(c.id).length+' projeto(s)';
  document.getElementById('head').innerHTML='<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span class="crumb">'+crumb+'</span><span class="headtitle"'+(o?' style="color:#A3271B"':'')+'>'+esc(o?o.nome:c.nome)+'</span><span class="crumb">'+sub+'</span></div><div class="tags">'+tags+'</div>';document.getElementById('pgbarAc').innerHTML=mov;
  if(document.getElementById('caminho'))document.getElementById('caminho').textContent='\\FG\\CLIENTES\\'+(grupoDe(c)?grupoDe(c).toUpperCase()+'\\':'')+c.id+(o?'\\'+o.id:'');
  // KPIs
  var base=t.contrato||1,pct=function(v){return Math.min(100,Math.round(v/base*100))};
  var k=[['Valor contratado (bruto)',brl(t.contrato),'',100,'#1F5FAD',o&&!o.contrato?'sem contrato cadastrado: soma das NF':''],
         ['NF emitidas (bruto)',brl(t.faturado),'',pct(t.faturado),'#5A6676',''],

         ['A receber em dinheiro (bruto)',brl(t.receber),'color:#163F75',pct(t.receber),'#1F5FAD',t.abertas?t.abertas+' parcela(s) em aberto':'nada em aberto']];
  document.getElementById('kpis').innerHTML=k.map(function(x){return '<div class="box kpi"><small>'+x[0]+'</small><b style="'+x[2]+'">'+x[1]+'</b><em>'+(x[5]||'&nbsp;')+'</em><div class="bar"><span style="width:'+x[3]+'%;background:'+x[4]+'"></span></div></div>'}).join('');
  // abas
  document.getElementById('tabs').innerHTML=ab.map(function(a){return '<button class="tab'+(a[0]===S.aba?' on':'')+'" data-a="'+a[0]+'" type="button">'+a[1]+'</button>'}).join('');

var PT=10;
function paginaTab(rows){var n=Math.max(1,Math.ceil(rows.length/PT));if(S.pgPar>n-1)S.pgPar=n-1;return rows.slice(S.pgPar*PT,S.pgPar*PT+PT).join('')}
function pgTab(total){var n=Math.max(1,Math.ceil(total/PT));
  return '<div class="secthead" style="font-size:12px;color:var(--mut)"><span>'+total+' linha(s)</span><span class="sp"></span>'+(n>1?'<button class="mini" '+(S.pgPar===0?'disabled':'')+' onclick="S.pgPar--;desenhaPainel()">&#9664;</button><span>Página '+(S.pgPar+1)+' de '+n+'</span><button class="mini" '+(S.pgPar>=n-1?'disabled':'')+' onclick="S.pgPar++;desenhaPainel()">&#9654;</button>':'')+'</div>'}
var AJT=0;
function ajustaTabela(){
  if(AJT)return;
  var w=document.getElementById('tw');if(!w)return;
  var cabe=function(){var x=document.getElementById('tw');return !x||x.scrollHeight<=x.clientHeight+1};
  AJT=1;
  try{
    // cresce enquanto couber (até 40 linhas), depois encolhe até não cortar nenhuma linha
    var n=0;while(cabe()&&n++<40){var tot=document.querySelectorAll('#tw tbody tr').length;if(tot<PT)break;var prim=S.pgPar*PT;PT++;S.pgPar=Math.floor(prim/PT);desenhaPainel()}
    n=0;while(!cabe()&&PT>3&&n++<40){var prim2=S.pgPar*PT;PT--;S.pgPar=Math.floor(prim2/PT);desenhaPainel()}
  }finally{AJT=0}
}

        f.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:300;background:#F2C94C;color:#1E2733;font:600 17px Segoe UI,Arial,sans-serif;text-align:center;padding:12px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25)';
        f.textContent = 'Há dados novos no sistema — clique aqui para atualizar a página (termine antes o que está digitando).'; f.onclick = () => location.reload(); document.body.appendChild(f);
      }, () => {}); }
  } catch (e) {
    $('fgCarregando').style.display = 'none'; $('fgEntrar').style.display = 'flex';
    $('fgMsg').textContent = /permission|insufficient/i.test(e.message) ? 'Esta conta (' + u.email + ') não tem acesso. Entre com a conta autorizada.' : 'Não abriu: ' + e.message;
  }
});
</script>
</body>
</html>
