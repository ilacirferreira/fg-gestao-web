<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FG Gestão – Documentos</title>
<style>
.lk{cursor:pointer}.lk:hover{color:#1F5FAF;text-decoration:underline}
:root{
  --bg:#DCE1E7; --panel:#FFFFFF; --soft:#F3F5F7; --line:#C3CAD3; --line2:#E1E5EA;
  --txt:#1E2733; --mut:#4A5565; --blue:#1F5FAD; --blue2:#163F75; --sel:#D6E4F7; --hov:#EEF3FA;
  --ok-bg:#DDF0E4; --ok:#1E5E38; --warn-bg:#FCEBD3; --warn:#7A4A0B; --bad-bg:#F8DEDA; --bad:#8E2A1F;
  --info-bg:#DDE8F7; --info:#163F75; --perm-bg:#ECE3F5; --perm:#5B3A86; --gray-bg:#E9ECF0; --gray:#4A5565;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:Consolas,"Courier New",monospace}
.app{height:100vh;display:flex;flex-direction:column;padding:0 8px}
.titlebar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#1F3B5C;color:#fff;border-radius:0 0 3px 3px}
.titlebar b{font-size:14px;white-space:nowrap}
.titlebar span{font-size:12px;color:#C9D6E6;white-space:nowrap}
.titlebar .usr{margin-left:auto}
/* barra de botões: largura toda, botões do mesmo tamanho */
.toolbar{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:6px 0}
.tb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:4px 6px;border:1px solid #B9C3CF;border-radius:4px;background:#F7F8FA;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#E4ECF7;border-color:#7FA6DA}
.tb.novo{background:var(--blue);border-color:var(--blue);color:#fff}
.tb.novo:hover{background:var(--blue2)}
.tb.verde{background:#E3F2E8;border-color:#7DB592;color:#1E5E38;font-weight:600}
.tb.verm{background:#FBEAE7;border-color:#D89A90;color:#8E2A1F;font-weight:600}
.tb:disabled{opacity:.45;cursor:default}
.tb svg{flex:none}
.body{display:grid;grid-template-columns:var(--larg,350px) 6px 1fr;gap:2px;flex:1;min-height:0}
.divisor{cursor:col-resize;border-radius:3px;position:relative}
.divisor::after{content:"";position:absolute;left:2px;top:45%;width:2px;height:40px;border-left:1px dotted #8E99A6;border-right:1px dotted #8E99A6}
.divisor:hover,.divisor.arr{background:#C9D6E6}
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.boxhead{padding:6px 8px;border-bottom:1px solid var(--line);background:#EEF1F4;display:flex;gap:6px;align-items:center}
/* árvore */
.left{display:flex;flex-direction:column;min-height:0}
.search{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid #B8C0CA;border-radius:3px;background:#fff;min-height:30px}
.search input{border:none;outline:none;width:100%;background:transparent}
.chaves{display:flex;gap:12px;padding:5px 8px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--mut)}
.chave{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sw{width:28px;height:16px;border-radius:8px;background:#C3CAD3;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .12s}
.sw.on{background:var(--blue)}.sw.on::after{left:14px}
.tree{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 6px;scrollbar-width:thin}
.node{display:flex;align-items:center;gap:6px;min-height:26px;padding:2px 6px;border:1px solid transparent;border-radius:3px;cursor:pointer;user-select:none;line-height:1.2}
.node:hover{background:var(--hov)}
.node.sel{background:var(--sel);border-color:#7FA6DA}
.node .nm{flex:1;min-width:0}
.node.b .nm{font-weight:600}
.node.obr .nm{color:#A3271B}
.node.grp{background:#DCE8F8;border-color:#A9C2E6;color:#163F75;margin:2px 0}
.node.grp:hover{background:#CFE0F6}
.node.grp.pfg{background:#E9E2F5;border-color:#C3B3E0;color:#4A2F78}
.node.grp.pfg:hover{background:#E0D6F1}
.node.grp.outg{background:#E6EAEF;border-color:#C3CAD3;color:#2E3A48}
.node.grp.outg:hover{background:#DCE1E7}
.node.grp .cnt{color:inherit;opacity:.8}
.chev{width:12px;height:12px;flex:none;transition:transform .12s}
.chev.op{transform:rotate(90deg)}
.nochev{width:12px;flex:none}
.cnt{font-size:11px;color:#5A6676;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ind{flex:none}
.pgbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;border-top:1px solid var(--line2);font-size:12px;color:var(--mut)}
.pgbar a{color:var(--blue);text-decoration:none;white-space:nowrap}.pgbar a:hover{text-decoration:underline}
.pgbar .pg{display:flex;align-items:center;gap:6px}
.mini{min-width:28px;min-height:24px;border:1px solid #9AA5B2;border-radius:3px;background:#F6F7F9;cursor:pointer}
.mini:disabled{opacity:.4;cursor:default}
.legend{display:flex;gap:8px;flex-wrap:nowrap;justify-content:space-between;padding:5px 8px;white-space:nowrap;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* painel */
.right{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.head{padding:8px 14px;display:flex;align-items:center;gap:12px}
.crumb{font-size:12px;color:var(--mut)}
.headtitle{font-size:17px;font-weight:600;line-height:1.25}
.head .btn{flex:none}
.head .acoes{display:flex;gap:6px}
.tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-perm{background:var(--perm-bg);color:var(--perm)}.t-gray{background:var(--gray-bg);color:var(--gray)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:7px 12px}
.kpi.clk{cursor:pointer;border-color:var(--blue)}.kpi.clk:hover{background:var(--hov)}.kpi .kgo{color:var(--blue);font-weight:700}
.kpi small{display:block;font-size:12px;color:var(--mut);white-space:nowrap}
.kpi b{display:block;font-size:18px;margin-top:1px;white-space:nowrap}
.kpi em{display:block;font-size:11px;color:var(--mut);font-style:normal;white-space:nowrap}
.kpi .bar{height:5px;background:#E6EAEF;border-radius:3px;margin-top:5px;overflow:hidden}
.kpi .bar span{display:block;height:100%;background:var(--blue)}
.dlg{background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px 12px 10px;display:flex;flex-direction:column;flex:1;min-height:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;border-bottom:1px solid var(--line)}
.tab{padding:6px 8px;border:1px solid var(--line);border-bottom:none;border-radius:4px 4px 0 0;background:#E9ECF0;color:#3A4554;cursor:pointer;min-height:32px;white-space:nowrap}
.tab.on{background:#fff;color:var(--txt);font-weight:600;position:relative;top:1px}
.pane{background:#fff;border:1px solid var(--line);border-top:none;padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow:hidden}
.ficha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:11.5px;color:var(--mut)}
.fld .v{min-height:28px;line-height:1.3;padding:4px 7px;border:1px solid #D9CF9E;border-radius:3px;background:#FFFBEA}
.fld .v.vz{color:#9AA5B2}
.fld .v.sis{background:#F3F5F7;border-color:#D5DBE2;color:var(--mut)}
.fld input,.fld select{padding:4px 7px;border:1px solid #B8C0CA;border-radius:3px;background:#FFFBEA;min-height:28px}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.secthead{display:flex;align-items:center;gap:8px}
.secthead b{font-size:13px;white-space:nowrap}
.secthead .sp{flex:1}
.btn{min-height:28px;padding:3px 12px;border-radius:3px;border:1px solid #9AA5B2;background:#F6F7F9;cursor:pointer;white-space:nowrap}
.btn:hover{background:#ECEFF3}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue2)}
.btn.ok{background:#2E7D4F;border-color:#2E7D4F;color:#fff}
.btn.red{background:#B23B2E;border-color:#B23B2E;color:#fff}
.tablewrap{border:1px solid var(--line);border-radius:3px;flex:1;min-height:0;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;vertical-align:top;padding:5px 8px;background:#EEF1F4;border-bottom:1px solid var(--line);color:#3A4554;font-size:12px}
td{padding:4px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.w{white-space:normal;line-height:1.25}
td.r,th.r{text-align:right}
tr.hl td{background:#FFF6E5}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--hov)}
tfoot td{font-weight:600;background:#F7F8FA}
.info{padding:6px 10px;background:#EEF3FA;border:1px solid #B9CBE4;border-radius:3px;font-size:12px;line-height:1.35}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.card{border:1px solid var(--line);border-radius:3px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card b{font-size:13px}
.card small{color:var(--mut);overflow-wrap:anywhere}
.file{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:#FAFBFC}
.file .ic{width:34px;height:42px;border:1px solid #B8C0CA;border-radius:2px;background:#fff;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;color:#B23B2E;padding-bottom:4px;flex:none}
.file small{display:block;color:var(--mut);font-size:12px}
.drop{border:1px dashed #9AA5B2;border-radius:3px;padding:12px;text-align:center;color:var(--mut);background:#FAFBFC}
.statusbar{display:flex;gap:22px;padding:4px 14px;margin-top:6px;background:var(--soft);border:1px solid var(--line);border-bottom:none;border-radius:3px 3px 0 0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.statusbar span:last-child{margin-left:auto}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.mbox{width:min(640px,100%);max-height:96vh;background:var(--soft);border:1px solid #8E99A6;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.mtitle{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#1F3B5C;color:#fff;border-radius:4px 4px 0 0;font-weight:600}
.mtitle button{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;width:32px;height:26px}
.mbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.mgrid .fld input,.mgrid .fld select,.mgrid .fld textarea{background:#FFFBEA;padding:4px 7px;border:1px solid #B8C0CA;border-radius:3px;min-height:28px}
.mgrid .fld input[readonly]{background:#F3F5F7;color:var(--mut)}
.mfoot{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:8px 16px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1F3B5C;color:#fff;padding:8px 16px;border-radius:4px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
/* janelas (pop-up) grandes e com letra maior — usuários idosos (Ilacir 02/11 19:55) */
.modal .mbox{width:min(980px,94vw);font-size:16px}
.modal .mbox.larga{width:min(1180px,96vw)}
.modal .mtitle{font-size:17px;padding:10px 16px}
.modal .mbody{padding:16px 20px;gap:12px}
.modal .mbody label,.modal .fld label{font-size:14px}
.modal .fld .v,.modal input,.modal select,.modal textarea{font-size:16px;min-height:36px}
.modal .info{font-size:15px;line-height:1.45}
.modal .btn{min-height:42px;font-size:16px}
.modal .mfoot{padding:12px 20px;gap:10px}
.modal .tag{font-size:13px}
.modal .em{font-size:15px;padding:6px 10px}
.modal .et{font-size:14px;padding:8px 12px}
.modal .tot b{font-size:18px}
.modal input[type=checkbox],.modal input[type=radio]{width:18px;height:18px;min-height:0}
.modal .secthead b{font-size:16px}
.modal .cnt,.modal small{font-size:13.5px}
.modal .tot small{font-size:13.5px}
.modal .em label,.modal label.em{font-size:15px}

/* troca de folha das listas bem visível (Ilacir 02/11 23:44: "o extrato de outubro não aparece completo") */
body .pgline{justify-content:center;gap:14px;font-size:16px;font-weight:600;color:#1F3B5C;padding:6px 0 2px;white-space:nowrap}
body .pgline .mini{width:42px;height:42px;min-width:42px;border-radius:50%;border:0;background:#2F4A63;color:#fff;font-size:17px;line-height:42px;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
body .pgline .mini:hover{background:#1F3B5C}
body .pgline .mini:disabled{opacity:.28;cursor:default;box-shadow:none}

/* PRÉVIA 05/11 — regras gerais G1/G2/G3 */
.headrow{display:flex;gap:8px;align-items:stretch}
.headrow>#head{flex:0 0 auto;min-width:230px;max-width:44%}
.headrow.sokpi>#head{flex:1}
.headrow>#head .crumb,.headrow>#head .tags{display:none}
.headrow>#head .headtitle{font-size:19px;white-space:nowrap}
.headrow>.kpis{flex:1;min-width:0}
.headrow.sokpi>.kpis{display:none}
.headrow>.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.headrow .kpi{min-width:0}
.headrow .kpi b,.headrow .kpi em,.headrow .kpi small{overflow:hidden}
/* PRÉVIA 05/11 — paginação discreta (Ilacir 00:35: "pode ser mais discreto, para ganhar espaço") */
body .pgline{justify-content:flex-end;gap:6px;font-size:12px;font-weight:600;color:#1F3B5C;padding:2px 0 0}
body .pgline .mini{width:24px;height:22px;min-width:24px;min-height:22px;border-radius:4px;font-size:11px;line-height:22px;box-shadow:none}
/* PRÉVIA 05/11 — sem pop-up (Ilacir 00:37–00:39): a janela abre dentro da área de conteúdo, no lugar das abas */
.dlg>.modal{position:static!important;inset:auto;background:none!important;padding:0!important;z-index:auto;flex:1;min-height:0}
.dlg>.modal.on{display:flex}
.dlg>.modal .mbox{width:100%!important;max-width:none!important;max-height:none;height:100%;box-shadow:none;border:none;background:transparent}
.dlg>.modal .mtitle{border-radius:4px}
.dlg>.modal .mbody{overflow:auto;flex:1}
.dlg:has(>.modal.on)>.tabs,.dlg:has(>.modal.on)>.pane{display:none!important}
.dlg>.modal .mfoot,#pane .acoes-topo{display:none!important}
.headrow.vazio{display:none}

/* 05/11 12:22 — setinhas de página na linha de botões, à direita (Ilacir) */
.toolbar .pgtb{display:flex;align-items:center;gap:12px;padding:0 4px 0 8px;white-space:nowrap}.headrow>.pgpilha{flex:0 0 auto;margin-left:auto;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;padding:2px 4px}.headrow>.pgpilha .mini{width:20px!important;height:18px!important;min-width:20px!important;min-height:18px!important;border-radius:3px!important;font-size:9px!important;line-height:18px!important;padding:0!important;box-shadow:none!important}.headrow>.pgpilha .pgline,.headrow>.pgpilha .pgbar{display:flex!important;align-items:center;gap:8px;padding:0!important;margin:0!important;border:0!important;background:none!important;font-size:12px;font-weight:600;color:#163F75;line-height:20px!important;min-height:20px!important;height:auto!important}
.toolbar .pgtb .pgline,.toolbar .pgtb .pgbar{display:flex!important;align-items:center;gap:6px;padding:0!important;margin:0!important;border:0!important;background:none!important;font-size:12.5px}
#pane .pgmov,#pane .pgline,#pane .pgbar{display:none!important}
/* 05/11 12:30 — aba e botão da tela atual com cor (Ilacir) */
.tab.on{background:#DCEAFB!important;color:#163F75!important;border-color:#1F5FAD!important;border-top:3px solid #1F5FAD!important}
.toolbar .tb.atual{background:#DCEAFB!important;color:#163F75!important;border:2px solid #1F5FAD!important;font-weight:700!important}
/* 05/11 12:37 — formulário sem cara de pop-up: título claro, sem ×, fecha ao trocar de tela (Ilacir) */
.dlg>.modal .mtitle,.modal .mtitle{background:#E6EEF8!important;color:#163F75!important;border-bottom:2px solid #1F5FAD;border-radius:6px 6px 0 0}
.dlg>.modal .mtitle button{display:none!important}

/* 05/11 18:05 — linhas de explicação viram dica ao passar o mouse (Ilacir) */
.info.dica{display:none!important}
.dicai{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:#DCEAFB;color:#1F5FAD;border:1px solid #9DBAE3;font:700 12px/1 Georgia,serif;cursor:help;vertical-align:middle;flex:none}
.dicai:hover{background:#1F5FAD;color:#fff}

/* Ilacir 10/11 15:31: setinhas de página bem visíveis */
.toolbar .pgtb .pgline,.toolbar .pgtb .pgbar{font-size:15px!important;font-weight:600;color:#1F3B5C}
.toolbar .pgtb button{min-width:48px!important;min-height:40px!important;font-size:20px!important;font-weight:700;border-radius:6px}

.toolbar{grid-template-columns:repeat(6,1fr)}
.node.raiz{background:#1F3B5C;border-color:#1F3B5C;color:#fff;margin:2px 0}
.node.raiz:hover{background:#2A4C74}
.node.raiz .vl,.node.raiz .cnt{color:#DCE6F2}
.node.emit{background:#DCE8F8;border-color:#7FA6DA;color:#163F75;margin:2px 0}
.node.pend{background:#FCEBD3;border-color:#E3B877;color:#7A4A0B;margin:2px 0}
.node.ano{background:#E6EAEF;border-color:#C3CAD3;color:#2E3A48;margin:2px 0}
.node .vl{font-size:11.5px;white-space:nowrap;color:#3A4554}
.node .nm{white-space:nowrap}
.node.ob .nm{color:#A3271B;font-weight:600}
.cr{color:#1E5E38}.db{color:#8E2A1F}
#tw td,#tw th{white-space:nowrap}
.pgline{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--mut)}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.et{padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:#F3F5F7;color:var(--mut);font-size:12px;white-space:nowrap}
.et.on{background:#DCE8F8;border-color:#7FA6DA;color:#163F75;font-weight:600}
.et.ok{background:#DDF0E4;border-color:#9BCBAE;color:#1E5E38}
.big{display:flex;gap:10px;justify-content:center;padding:6px}
.big .btn{min-height:40px;min-width:220px;font-size:14px}
.conf .fld .v{min-height:26px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot div{border:1px solid var(--line);border-radius:3px;padding:6px 10px;white-space:nowrap}
.tot small{display:block;color:var(--mut);font-size:11.5px}
.tot b{font-size:15px}
.mbox.larga{width:min(820px,100%)}
table.h1 .opc{display:none}
.mfoot .btn,.node .nm,#tw td,#tw th,.tag,.kpi em{white-space:nowrap}
.secthead .btn{flex:none}
.node .vl{flex:none}
.node.sub .nm{color:#3A4554}
.db{color:#8E2A1F}.cr{color:#1E5E38}
.pgline{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--mut)}
table.h1 .opc{display:none}table.h2 .opc2{display:none}
.btn.cinza{background:#E9ECF0;border-color:#C3CAD3;color:#8E99A6}
</style>
</head>
<body>

function FG_abrev(n,k){var s=String(n||'').replace(/\s+/g,' ').trim();if(!k||/\b(ltda|s\/?a|me|epp|eireli|spe)\b|condom|cons[oó]rcio|construtora|engenharia|empreend|incorpora|imobili|munic[ií]pio|centro|grupo|escola|instituto/i.test(s))return s;
