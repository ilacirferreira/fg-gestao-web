  '<div style="display:flex;gap:16px;height:100%"><div style="flex:0 0 380px"><table><tbody>'+cs.map(function(c){return '<tr><td style="color:var(--mut)">'+esc(c)+'</td><td><b>'+esc(f[c])+'</b></td></tr>'}).join('')+'</tbody></table></div>'+

  (np>1?'<div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-top:8px;font-weight:600"><button style="min-width:48px;min-height:40px;font-size:20px" '+(MEUS_PG?'':'disabled ')+'onclick="MEUS_PG--;desenha()">◀</button>Página '+(MEUS_PG+1)+' de '+np+'<button style="min-width:48px;min-height:40px;font-size:20px" '+(MEUS_PG<np-1?'':'disabled ')+'onclick="MEUS_PG++;desenha()">▶</button></div>':'')+
  (hs.length?'':'<div class="aviso info">Nenhum holerite registrado ainda.</div>')+'</div></div>'}
/* Etapa 3 (10/11): projetos com valores e ARTs, só leitura */
var PROJ=null,PJ_PG=0,PJ_SEL=null,AR_PG=0;
function pjCarregar(){if(!PROJ&&!ESPERA)setTimeout(function(){chamar('colabProjetos',[],function(r){PROJ=r;desenha()})},0);return '<div class="aviso info">Abrindo os projetos…</div>'}
function porPag(){return Math.max(3,Math.floor((($('pane')&&$('pane').clientHeight)||400)-110)/34|0)}
function setas(pg,np,v){return np>1?'<div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-top:8px;font-weight:600"><button style="min-width:48px;min-height:40px;font-size:20px" '+(pg?'':'disabled ')+'onclick="'+v+'--;desenha()">◀</button>Página '+(pg+1)+' de '+np+'<button style="min-width:48px;min-height:40px;font-size:20px" '+(pg<np-1?'':'disabled ')+'onclick="'+v+'++;desenha()">▶</button></div>':''}
function paneProj(){if(!PROJ)return pjCarregar();
  if(PJ_SEL!=null){var c=PROJ.contratos[PJ_SEL];return '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><button style="min-height:36px;font-size:15px" onclick="PJ_SEL=null;desenha()">◀ Voltar à lista</button><b style="font-size:17px">'+esc(c.nome)+'</b><span style="color:var(--mut)">'+esc(c.cli)+'</span></div><table><thead><tr><th>Parcela</th><th>NF</th><th style="text-align:right">Valor</th><th>Data</th><th>Situação</th></tr></thead><tbody>'+
    c.parc.map(function(x){return '<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1]||'—')+'</td><td style="text-align:right">'+n2(x[2])+'</td><td>'+esc(x[3]||'—')+'</td><td><span class="tag '+(/paga|receb/i.test(x[4])?'t-ok':'t-info')+'">'+esc(x[4]||'—')+'</span></td></tr>'}).join('')+'</tbody></table>'}
  var L=PROJ.contratos,P=porPag(),np=Math.max(1,Math.ceil(L.length/P));if(PJ_PG>np-1)PJ_PG=np-1;
  return '<table><thead><tr><th>Projeto</th><th>Cliente</th><th style="text-align:right">Contrato</th><th style="text-align:right">Faturado</th><th style="text-align:right">Recebido</th><th>Situação</th></tr></thead><tbody>'+
    L.slice(PJ_PG*P,PJ_PG*P+P).map(function(c,i){return '<tr style="cursor:pointer" title="Clique para ver as parcelas" onclick="PJ_SEL='+(PJ_PG*P+i)+';desenha()"><td class="fit" style="max-width:380px"><b>'+esc(c.nome)+'</b></td><td class="fit" style="max-width:260px">'+esc(c.cli)+'</td><td style="text-align:right">'+n2(c.total)+'</td><td style="text-align:right">'+n2(c.fat)+'</td><td style="text-align:right">'+n2(c.rec)+'</td><td><span class="tag t-info">'+esc(c.sit||'—')+'</span></td></tr>'}).join('')+'</tbody></table>'+setas(PJ_PG,np,'PJ_PG')+(L.length?'':'<div class="aviso info">Nenhum projeto.</div>')}
function paneArts(){if(!PROJ)return pjCarregar();var L=PROJ.arts,P=porPag(),np=Math.max(1,Math.ceil(L.length/P));if(AR_PG>np-1)AR_PG=np-1;
  return '<table><thead><tr><th>Nº da ART</th><th>Projeto</th><th>Registro</th><th>Área</th></tr></thead><tbody>'+L.slice(AR_PG*P,AR_PG*P+P).map(function(a){return '<tr><td><b>'+esc(a.numero)+'</b></td><td>'+esc(a.obra)+'</td><td>'+esc(a.registro)+'</td><td>'+esc(a.area)+'</td></tr>'}).join('')+'</tbody></table>'+setas(AR_PG,np,'AR_PG')+(L.length?'':'<div class="aviso info">Nenhuma ART.</div>')}
function corrigir(){var d=$('cDia').value.trim(),t=$('cTipo').value,h=$('cHora').value,m=$('cMot').value.trim(),sn=$('cSenha').value;
  if(!/^\d\d\/\d\d\/\d{4}$/.test(d)){toast('Dia no formato dd/mm/aaaa.');return}if(!h){toast('Informe a hora certa.');return}if(m.length<5){toast('Escreva o motivo.');return}if(!sn){toast('Quem autoriza digita a senha.');return}
  chamar('pontoCorrigirComSenha',[d,t,h,m,sn,($('cAut')||{}).value||''],function(r){E=r;TAB=0;toast('Correção gravada ✓ (a hora original ficou guardada)');desenha()})}
function paneMes(){var ks=Object.keys(E.dias).filter(function(k){return k.slice(3)===E.hoje.slice(3)}).sort(),tot=0;
  if(!ks.length)return '<div class="aviso info">Nenhuma marcação neste mês ainda.</div>';
  var lin=ks.slice(-12).reverse().map(function(k){var x=E.dias[k];if(x.min)tot+=x.min;return '<tr><td><b>'+k.slice(0,5)+' '+DIAS_SEM[dt(k).getDay()]+'</b></td>'+TIPOS.map(function(t){var m=x[t];return '<td>'+(m?m.h+(m.o==='autorizada'?' <span class="tag t-warn" title="'+esc(m.mot)+'">autorizada por '+esc(m.a)+'</span>':m.o==='correcao'?' <span class="tag t-info" title="Era '+esc(m.ori)+'. Motivo: '+esc(m.mot)+'">corrigida</span>':''):'—')+'</td>'}).join('')+'<td>'+(x.min!=null?hm(x.min):'—')+'</td></tr>'}).join('');
  return '<table><thead><tr><th>Dia</th>'+TIPOS.map(function(t){return '<th>'+NOMES[t]+'</th>'}).join('')+'<th>Horas</th></tr></thead><tbody>'+lin+'</tbody></table>'+(ks.length>12?'<div class="aviso info" style="margin-top:8px">Mostrando os 12 dias mais recentes. A folha completa fica com o Ilacir.</div>':'')}
function paneComo(){return '<div class="aviso info">São 4 marcações por dia, nesta ordem: Entrada, Saída para Almoço, Volta do Almoço e Saída. Clique no botão azul de cima na hora de cada uma.</div><div class="aviso info" style="margin-top:8px">Marcação errada ou esquecida: aba Corrigir Marcação, com o Ilacir do lado. Não dá para marcar hora passada. Se esquecer a saída, no dia seguinte a entrada fica bloqueada até o Ilacir ou o Thiago lançar a hora com a senha.</div>'}
function paneLiberar(){var p=E.situacao.pendente;
  if(!E.autorizadores.length)return '<div class="aviso bad">O Ilacir e o Thiago ainda não cadastraram a senha de liberação. Avise o Ilacir.</div>';
  return '<div class="aviso info" style="margin-bottom:12px">Para o Ilacir ou o Thiago: informe a(s) hora(s) que faltam de '+p.data+' e digite a sua senha. Fica gravado "lançada no dia seguinte, autorizada por" quem liberou.</div><div class="form">'+
   p.faltam.map(function(t){return '<div class="fld"><label>'+NOMES[t]+(t==='saida'?' *':' (em branco = sem almoço)')+'</label><input id="h_'+t+'" type="time" step="60"></div>'}).join('')+
   '<div class="fld"><label>Quem autoriza</label><select id="aut">'+E.autorizadores.map(function(a){return '<option>'+esc(a)+'</option>'}).join('')+'</select></div>'+
   '<div class="fld"><label>Senha de quem autoriza</label><input id="senha" type="password" autocomplete="off"></div></div>'}
function paneSenha(){return '<div class="aviso info" style="margin-bottom:12px">Esta senha libera a entrada quando a saída do dia anterior não foi marcada. Só você a conhece: o sistema guarda apenas um código embaralhado.</div><div class="form">'+
   '<div class="fld"><label>Senha atual (se já tiver)</label><input id="sAtual" type="password" autocomplete="off"></div>'+
   '<div class="fld"><label>Nova senha (mínimo 6)</label><input id="sNova" type="password" autocomplete="new-password"></div>'+
   '<div class="fld"><label>Repita a nova senha</label><input id="sNova2" type="password" autocomplete="new-password"></div></div>'}
function minAte(hm){var a=agoraHM().split(':'),b=String(hm).split(':');return (+b[0]*60+ +b[1])-(+a[0]*60+ +a[1])}
/* redesenha a cada minuto perto do fim do expediente (aviso dos 30 minutos) */
setInterval(function(){if(E&&!ESPERA&&E.saidaAte){var f=minAte(E.saidaAte);if(f<=31&&f>=-1)desenha()}},60000);
function hTxt(){var m=(E.cfg&&E.cfg.semPausaMaxMin!=null)?+E.cfg.semPausaMaxMin:360;return Math.floor(m/60)+'h'+(m%60?('0'+m%60).slice(-2):'')}
function marcarSaidaSemAlmoco(){chamar('pontoMarcar',['saida'],function(r){E=r;TAB=0;var m=(r.dias[r.hoje]||{}).saida;toast('Saída marcada às '+(m?m.h:'')+' ✓ (dia sem almoço)');desenha()})}
function marcar(){var t=E.situacao.tipo;chamar('pontoMarcar',[t],function(r){E=r;TAB=0;var m=(r.dias[r.hoje]||{})[t];toast(NOMES[t]+' marcada às '+(m?m.h:'')+' ✓');desenha()})}
function liberar(){var p=E.situacao.pendente,h={};p.faltam.forEach(function(t){h[t]=$('h_'+t).value});
  if(!h.saida){toast('Informe a hora da saída.');return}if(!$('senha').value){toast('Digite a senha de quem autoriza.');return}
  chamar('pontoLiberar',[h,$('aut').value,$('senha').value],function(r){E=r;TAB=0;toast('Lançado e liberado ✓ Agora marque a entrada.');desenha()})}
function gravarSenha(){var n=$('sNova').value;if(n.length<6){toast('A nova senha precisa ter pelo menos 6 caracteres.');return}if(n!==$('sNova2').value){toast('As duas senhas novas não são iguais.');return}
  chamar('pontoSenhaDefinir',[n,$('sAtual').value],function(r){toast(r);carregar()})}
setInterval(function(){if(E&&!ESPERA&&E.semPausa){var st=agoraHM()>E.semPausa.pausaAte?2:agoraHM()>E.semPausa.limite?1:0;st=(agoraHM()>E.semPausa.limite?1:0)+(agoraHM()>E.semPausa.pausaAte?2:0);if(st!==window.__sp){window.__sp=st;desenha()}}},20000);
setInterval(function(){if(E&&!ESPERA&&E.situacao&&E.situacao.tipo==='volta'&&E.voltaAs){var lib=agoraHM()>=E.voltaAs;if(lib!==window.__lib){window.__lib=lib;desenhaBarra()}}},5000);
setInterval(function(){var e=$('relogio');if(e){var d=new Date();e.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)}},500);
setInterval(function(){if(E&&!ESPERA&&document.visibilityState==='visible'&&!document.activeElement.matches('input,select,textarea')&&!(window.EC&&EC.form))carregar()},10*60*1000);

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
const app = initializeApp({"apiKey":"AIzaSyDJpZqekcTxW5C3AJTtkFNKwJVr7cMVMSI","authDomain":"fg-gestao.firebaseapp.com","projectId":"fg-gestao","appId":"1:933388015487:web:a22b389975c1c9d1e7ec4a"});
const auth = getAuth(app); window.__fgAuth = auth;
const $ = id => document.getElementById(id);
/* 10/11: o computador da Edna já tem a conta da FG aberta no Google — sempre mostrar a escolha de conta */
const prov = new GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
$('fgBt').onclick = () => signInWithPopup(auth, prov).catch(e => { $('fgMsg').textContent = 'Não entrou: ' + e.message; });

onAuthStateChanged(auth, async u => {
  if (!u) { $('fgCarregando').style.display = 'none'; $('app').style.display = 'none'; $('fgEntrar').style.display = 'flex'; return; }
  $('fgEntrar').style.display = 'none'; $('fgCarregando').style.display = 'flex';
  try {
    const tk = await u.getIdToken();
    const j = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'pontoEstado', args: [{ __ap: window.fgAparelho() }], token: tk }) })).json();
    if (!j.ok) throw new Error(j.erro || 'sem acesso');
    window.E = j.r; E = j.r; $('fgCarregando').style.display = 'none'; $('app').style.display = 'flex'; desenha();
  } catch (e) {
    $('fgCarregando').style.display = 'none'; $('fgEntrar').style.display = 'flex';
    const m = String(e.message || '');
    if (/^FORA DO HORÁRIO/.test(m)) { $('fgMsg').innerHTML = '<b style="font-size:18px">' + m.replace(/^FORA DO HORÁRIO: /, 'A ') + '</b>'; $('fgBt').style.display = 'none'; return; }

      $('fgMsg').innerHTML = '<b style="font-size:17px">Este computador ainda não está liberado para o ponto.</b><br><br>Peça ao Ilacir para digitar a senha de liberação dele aqui:<br>' +
        '<input id="apSenha" type="password" autocomplete="off" style="margin-top:12px;font-size:18px;padding:8px;width:220px;border:1px solid #9FB3C8;border-radius:6px"> ' +
        '<button id="apOk" style="font-size:17px;padding:9px 20px;border:0;border-radius:8px;background:#1F5FAF;color:#fff;cursor:pointer">Liberar este computador</button><div id="apErr" style="color:#B23B2E;margin-top:10px"></div>';
      $('apOk').onclick = async () => {
        $('apOk').disabled = true; $('apErr').textContent = '';
        try { const t2 = await u.getIdToken(); const r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'pontoAparelhoLiberar', args: [$('apSenha').value, { __ap: window.fgAparelho() }], token: t2 }) })).json();
          if (!r.ok) throw new Error(r.erro); location.reload(); } catch (x) { $('apOk').disabled = false; $('apErr').textContent = 'Não liberou: ' + x.message; }
      };
      return;
    }
    $('fgMsg').textContent = 'Não abriu: ' + m;
  }
});
</script>
